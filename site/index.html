<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Country Trail — full trail viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <div class="masthead">
    <img class="masthead-logo" src="ncta-logo.png"
      alt="North Country Trail Association">
    <div class="masthead-words">
      <h1>North Country Trail</h1>
      <p class="masthead-desc">Full trail viewer</p>
    </div>
    <button type="button" id="present-btn" class="present-btn"
      title="Present — big screen"
      aria-label="Present — big screen">⛶</button>
  </div>

  <select id="chapter-select" aria-label="Jump to a chapter">
    <option value="">Choose a chapter&hellip;</option>
  </select>

  <div id="gazetteer">
    <input id="gaz-search" type="search" autocomplete="off"
      placeholder="Type a place, mile marker, or chapter&hellip;">
    <div id="gaz-results" role="listbox" aria-label="Place search results"></div>
  </div>

  <div id="inspector" tabindex="-1"><!-- chapter record injected by app.js --></div>

  <div id="layer-toggles"><!-- checkboxes injected by app.js --></div>

  <div class="tog-group" id="basemap-group" role="button"
    aria-expanded="false" tabindex="0">&#9656; Basemap</div>
  <div class="tog-group-body collapsed" id="basemap-body">
    <div id="background-choices"><!-- base choices injected by app.js --></div>
    <label class="wayback-field">Aerial by year (Esri Wayback)
      <select id="wayback-select">
        <option value="">No year aerial</option>
      </select>
    </label>
  </div>

  <p class="panel-foot"><a href="about.html" target="_blank"
    rel="noopener" id="about-link">About this map</a>
    <a href="data-sources.html" target="_blank"
    rel="noopener" id="sources-link">Data sources</a>
    <a href="https://pauljmorin.github.io/itasca-moraine-trail-map/site/" target="_blank"
    rel="noopener" id="itasca-link">Itasca Moraine chapter map</a></p>
</div>
<div id="map">
  <!-- Map-corner actions (ITM idiom: small icon-only squares, in the
       Present button's style): copy link, print, whole trail. -->
  <div id="map-actions">
    <button type="button" id="copy-link-btn" title="Copy link to this view"
      aria-label="Copy link to this view"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="print-btn" title="Print"
      aria-label="Print"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9V2h12v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="14" width="12" height="8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="whole-trail-btn" title="Zoom to the whole trail"
      aria-label="Zoom to the whole trail"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <!-- Legend lives behind this corner button, toggled by app.js;
       the card starts closed. -->
  <div id="corner-ui">
    <div id="legend-card" class="corner-card" hidden>
      <h2>Legend</h2>
      <div id="legend"><!-- legend injected by app.js --></div>
    </div>
    <div id="corner-buttons">
      <button type="button" id="btn-legend" aria-pressed="false">Legend</button>
    </div>
  </div>
  <button type="button" id="show-panel-btn" hidden>&lsaquo; Show panel</button>
</div>
<script src="leaflet.js"></script>
<script src="esri-leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
