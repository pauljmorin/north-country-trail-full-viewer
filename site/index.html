<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Country Trail — full trail viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <div class="masthead">
    <img class="masthead-logo" src="ncta-logo.png"
      alt="North Country Trail Association">
    <div class="masthead-words">
      <h1>North Country Trail</h1>
      <p class="masthead-desc">Full trail viewer</p>
    </div>
    <button type="button" id="present-btn" class="present-btn"
      title="Present — big screen"
      aria-label="Present — big screen">⛶</button>
  </div>

  <div class="panel-actions">
    <button type="button" id="copy-link-btn" class="copy-link-btn" title="Copy link to this view">Copy link</button>
    <button type="button" id="whole-trail-btn" class="whole-trail-btn" title="Zoom to the whole trail">Whole trail</button>
  </div>

  <h2>Chapters</h2>
  <label class="chapter-field">Jump to a chapter
    <select id="chapter-select">
      <option value="">Choose a chapter&hellip;</option>
    </select>
  </label>
  <p class="chapter-hint">Click a chapter to highlight its miles and
    zoom to them.</p>
  <div id="chapter-list" role="listbox" aria-label="Chapters, west to east">
    <!-- chapter rows injected by app.js -->
  </div>

  <h2>Find</h2>
  <div id="gazetteer">
    <input id="gaz-search" type="search" autocomplete="off"
      placeholder="Type a place, mile marker, or chapter&hellip;">
    <div id="gaz-results" role="listbox" aria-label="Place search results"></div>
  </div>
  <p class="gaz-hint">8,930 places along the trail. Type at least two
    characters.</p>

  <div id="inspector" tabindex="-1"><!-- chapter record injected by app.js --></div>

  <div id="layer-toggles"><!-- checkboxes injected by app.js --></div>

  <h2 id="basemap-head">Basemap</h2>
  <div id="background-choices"><!-- base choices injected by app.js --></div>
  <label class="wayback-field">Aerial by year (Esri Wayback)
    <select id="wayback-select">
      <option value="">No year aerial</option>
    </select>
  </label>

  <p id="load-status" class="status" role="status">Loading map data&hellip;</p>

  <p class="panel-foot"><a href="about.html" target="_blank"
    rel="noopener" id="about-link">About this map</a> &middot;
    <a href="data-sources.html" target="_blank"
    rel="noopener" id="sources-link">Data sources</a> &middot;
    <a href="https://pauljmorin.github.io/itasca-moraine-trail-map/site/" target="_blank"
    rel="noopener" id="itasca-link">Itasca Moraine chapter map</a></p>
</div>
<div id="map">
  <!-- Legend lives behind this corner button, toggled by app.js;
       the card starts closed. -->
  <div id="corner-ui">
    <div id="legend-card" class="corner-card" hidden>
      <h2>Legend</h2>
      <div id="legend"><!-- legend injected by app.js --></div>
    </div>
    <div id="corner-buttons">
      <button type="button" id="btn-legend" aria-pressed="false">Legend</button>
    </div>
  </div>
  <button type="button" id="show-panel-btn" hidden>&lsaquo; Show panel</button>
</div>
<script src="leaflet.js"></script>
<script src="esri-leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
